name: Builds, tests & co

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions: read-all

# The four jobs run in parallel. Each sets up OCaml from the same shared, pinned
# cache (built once on a cold run, restored on warm ones), so wall-clock is the
# slowest single lane — the build — rather than the sum of all steps.
jobs:
  build-test:
    permissions:
      attestations: write
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        ocaml-compiler:
          - "5.2.1"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout tree
        uses: actions/checkout@v4
      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          dune-cache: true
      - run: opam install . --deps-only --with-test
      - run: opam exec -- dune build
      - run: opam exec -- dune runtest

  lint-fmt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tree
        uses: actions/checkout@v4
      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2.1"
          dune-cache: true
      - uses: ocaml/setup-ocaml/lint-fmt@v3

  lint-doc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tree
        uses: actions/checkout@v4
      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2.1"
          dune-cache: true
      - uses: ocaml/setup-ocaml/lint-doc@v3

  # Plain `opam lint` instead of ocaml/setup-ocaml/lint-opam@v3: that action
  # installs opam-dune-lint, which pins an older dune and forces a downgrade +
  # recompile of ~67 packages (the whole Core/ppx tree) — ~3m20s every run.
  # `opam lint` validates the package metadata with no extra packages.
  lint-opam:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tree
        uses: actions/checkout@v4
      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2.1"
          dune-cache: true
      - run: opam lint gullwing.opam
