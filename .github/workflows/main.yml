name: Builds, tests & co

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

permissions: read-all

jobs:
  build-test-lint:
    permissions:
      attestations: write
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        ocaml-compiler:
          - "5.2.1"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout tree
        uses: actions/checkout@v4

      # Single OCaml setup for the whole job. Pinning an exact version (not a
      # floating "5") keeps the cache key stable, and dune-cache reuses build
      # artifacts across runs. The compiler is built from source only on a cold
      # cache; every warm run skips it.
      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}
          dune-cache: true

      - name: Install dependencies
        run: opam install . --deps-only --with-test --with-doc

      - name: Build
        run: opam exec -- dune build

      - name: Test
        run: opam exec -- dune runtest

      # Lints reuse the switch set up above instead of standing up their own
      # OCaml. `if: ${{ !cancelled() }}` runs each one even if a previous step
      # failed, so a failing build still reports fmt/doc/opam results — the same
      # independent feedback the separate jobs used to give.
      - name: Lint opam
        if: ${{ !cancelled() }}
        uses: ocaml/setup-ocaml/lint-opam@v3

      - name: Lint fmt
        if: ${{ !cancelled() }}
        uses: ocaml/setup-ocaml/lint-fmt@v3

      - name: Lint doc
        if: ${{ !cancelled() }}
        uses: ocaml/setup-ocaml/lint-doc@v3
