<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 340" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="11" markerHeight="11" refX="8" refY="3.5" orient="auto"><path d="M0,0 L8,3.5 L0,7 Z" fill="#33404d"/></marker>
  </defs>
  <rect x="0" y="0" width="780" height="340" rx="10" fill="#ffffff" stroke="#d7dde3"/>
  <text x="30" y="30" font-size="16" font-weight="700" fill="#1a202c">Instruction Shift Register (ISR)</text>

  <!-- MEM + 32-bit parallel-load bus -->
  <rect x="332" y="44" width="90" height="30" fill="#fdf3e0" stroke="#c05621"/>
  <text x="377" y="64" font-size="13" fill="#7b341e" text-anchor="middle">MEM</text>
  <line x1="377" y1="74" x2="377" y2="100" stroke="#33404d" stroke-width="1.6"/>
  <line x1="369" y1="94" x2="385" y2="84" stroke="#33404d" stroke-width="1.1"/>
  <text x="388" y="90" font-size="11" fill="#5a6570">32</text>

  <!-- top load rail: spans exactly first tap (S0) .. last tap (2 unused bits) -->
  <line x1="96" y1="100" x2="680" y2="100" stroke="#33404d" stroke-width="1.6"/>
  <text x="96" y="90" font-size="11" fill="#5a6570" text-anchor="middle">LSB</text>
  <text x="680" y="90" font-size="11" fill="#5a6570" text-anchor="middle">MSB</text>

  <!-- six 5-bit registers -->
  <g>
    <rect x="70"  y="155" width="52" height="40" fill="#eaf2fb" stroke="#2b6cb0"/>
    <rect x="170" y="155" width="52" height="40" fill="#eaf2fb" stroke="#2b6cb0"/>
    <rect x="270" y="155" width="52" height="40" fill="#eaf2fb" stroke="#2b6cb0"/>
    <rect x="370" y="155" width="52" height="40" fill="#eaf2fb" stroke="#2b6cb0"/>
    <rect x="470" y="155" width="52" height="40" fill="#eaf2fb" stroke="#2b6cb0"/>
    <rect x="570" y="155" width="52" height="40" fill="#eaf2fb" stroke="#2b6cb0"/>
    <g font-size="13" font-weight="600" fill="#1a365d" text-anchor="middle">
      <text x="96" y="180">S0</text><text x="196" y="180">S1</text><text x="296" y="180">S2</text>
      <text x="396" y="180">S3</text><text x="496" y="180">S4</text><text x="596" y="180">S5</text>
    </g>
  </g>

  <!-- parallel-load taps: rail -> each register (/5) -->
  <g stroke="#33404d" stroke-width="1.4">
    <line x1="96"  y1="100" x2="96"  y2="155" marker-end="url(#a)"/>
    <line x1="196" y1="100" x2="196" y2="155" marker-end="url(#a)"/>
    <line x1="296" y1="100" x2="296" y2="155" marker-end="url(#a)"/>
    <line x1="396" y1="100" x2="396" y2="155" marker-end="url(#a)"/>
    <line x1="496" y1="100" x2="496" y2="155" marker-end="url(#a)"/>
    <line x1="596" y1="100" x2="596" y2="155" marker-end="url(#a)"/>
  </g>
  <!-- /5 slashes on taps -->
  <g stroke="#33404d" stroke-width="1">
    <line x1="90" y1="132" x2="102" y2="122"/><line x1="190" y1="132" x2="202" y2="122"/>
    <line x1="290" y1="132" x2="302" y2="122"/><line x1="390" y1="132" x2="402" y2="122"/>
    <line x1="490" y1="132" x2="502" y2="122"/><line x1="590" y1="132" x2="602" y2="122"/>
  </g>
  <g font-size="10" fill="#8a94a0"><text x="104" y="126">5</text><text x="204" y="126">5</text><text x="304" y="126">5</text><text x="404" y="126">5</text><text x="504" y="126">5</text><text x="604" y="126">5</text></g>

  <!-- 2 unused MSB bits: separate vertical arrow, terminates (discarded) -->
  <line x1="680" y1="100" x2="680" y2="140" stroke="#33404d" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="674" y1="126" x2="686" y2="116" stroke="#33404d" stroke-width="1"/>
  <text x="688" y="120" font-size="10" fill="#8a94a0">2</text>
  <line x1="670" y1="144" x2="690" y2="144" stroke="#33404d" stroke-width="1.4"/>
  <text x="680" y="160" font-size="10" fill="#8a94a0" text-anchor="middle">не исп.</text>

  <!-- shift links (toward LSB / S0), each /5 -->
  <g stroke="#33404d" stroke-width="1.6">
    <line x1="170" y1="175" x2="122" y2="175" marker-end="url(#a)"/>
    <line x1="270" y1="175" x2="222" y2="175" marker-end="url(#a)"/>
    <line x1="370" y1="175" x2="322" y2="175" marker-end="url(#a)"/>
    <line x1="470" y1="175" x2="422" y2="175" marker-end="url(#a)"/>
    <line x1="570" y1="175" x2="522" y2="175" marker-end="url(#a)"/>
  </g>
  <!-- /5 slashes on shift links -->
  <g stroke="#33404d" stroke-width="1">
    <line x1="142" y1="180" x2="150" y2="170"/><line x1="242" y1="180" x2="250" y2="170"/>
    <line x1="342" y1="180" x2="350" y2="170"/><line x1="442" y1="180" x2="450" y2="170"/>
    <line x1="542" y1="180" x2="550" y2="170"/>
  </g>
  <g font-size="10" fill="#8a94a0" text-anchor="middle"><text x="140" y="167">5</text><text x="240" y="167">5</text><text x="340" y="167">5</text><text x="440" y="167">5</text><text x="540" y="167">5</text></g>

  <!-- PC@ fill shifts into S5 from the right (/5) -->
  <line x1="662" y1="175" x2="622" y2="175" stroke="#33404d" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="638" y1="180" x2="646" y2="170" stroke="#33404d" stroke-width="1"/>
  <text x="636" y="167" font-size="10" fill="#8a94a0">5</text>
  <text x="668" y="179" font-size="12" font-weight="600" fill="#8a94a0">PC@</text>

  <!-- INST out of S0 (/5) -->
  <line x1="96" y1="195" x2="96" y2="255" stroke="#33404d" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="90" y1="228" x2="102" y2="218" stroke="#33404d" stroke-width="1"/>
  <text x="104" y="223" font-size="10" fill="#8a94a0">5</text>
  <text x="96" y="273" font-size="12" font-weight="600" fill="#33404d" text-anchor="middle">INST</text>

  <!-- L out of S1 via NOR gate (/5): drop, corner, enter gate from the LEFT -->
  <polyline points="196,195 196,248 224,248" fill="none" stroke="#33404d" stroke-width="1.6"/>
  <line x1="190" y1="216" x2="202" y2="206" stroke="#33404d" stroke-width="1"/>
  <text x="204" y="211" font-size="10" fill="#8a94a0">5</text>
  <path d="M216,234 Q228,248 216,262 Q244,259 252,248 Q244,237 216,234 Z" fill="#eef1f4" stroke="#33404d" stroke-width="1.4"/>
  <circle cx="256" cy="248" r="4" fill="#eef1f4" stroke="#33404d" stroke-width="1.4"/>
  <line x1="260" y1="248" x2="292" y2="248" stroke="#33404d" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="300" y="252" font-size="12" font-weight="600" fill="#33404d">L</text>
  <text x="150" y="298" font-size="10.5" fill="#8a94a0">L = NOR(биты S1): 1, когда S1 = PC@ (все нули)</text>

  <text x="30" y="322" font-size="11" fill="#8a94a0">Адаптировано из: C. E. LaForest, «Second-Generation Stack Computer Architecture», 2007, Fig. 6.2.</text>
</svg>
